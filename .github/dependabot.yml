# Weekly dependency updates, grouped so each ecosystem is one pull request, not a dozen. Security fixes still arrive on their own.
#
# Major versions are ignored for packages that have to move together with others, or with the runtime, because a bump of one half is red by
# construction (@eslint/js 10 without eslint 10; Node types 26 on Node 22; the Inertia server and client packages). Upgrade those on purpose, in one PR.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: inertiajs/inertia-laravel
        update-types: ['version-update:semver-major']
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript-eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@inertiajs/vue3'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
