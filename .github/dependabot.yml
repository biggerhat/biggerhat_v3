# Weekly dependency updates, grouped so each ecosystem is one pull request, not a dozen. Security fixes still arrive on their own.
#
# Major versions are ignored for Composer and npm. Every one so far needed its own migration or was red by construction (@eslint/js 10 without
# eslint 10; Node types 26 on Node 22; tailwind-merge 3 needs Tailwind 4; the Inertia server and client together). Check for majors by hand,
# now and then, and upgrade each on purpose in its own PR.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
