name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci --prefer-offline --no-audit --no-fund

      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      - name: PHPStan
        run: composer stan

      # Type-check the Vue/TS sources with vue-tsc. The findings that predate the check are recorded per file in
      # scripts/typecheck-baseline.json; the build fails if any file gets MORE errors than its baseline (new files start at 0).
      # vue-tsc is installed under node_modules/.cache by the script, not into package.json, because having it resolvable
      # switches on prettier's organize-imports plugin and reorders imports across the frontend.
      - name: Type check (vue-tsc against baseline)
        run: npm run typecheck

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
