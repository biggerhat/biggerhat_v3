name: tournament browser flows

# The real-browser pass over the whole site (scripts/ui-audit/tournaments, see docs/ui-audit.md): every flows*.cjs, desktop and phone, with
# accessibility scans. It needs a built frontend and a Chrome and takes a while, so it runs every night on main (an issue is opened, or
# commented on, when it fails) and can be started by hand from the Actions tab before a release.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, gd, mbstring, intl, bcmath

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci --prefer-offline --no-audit --no-fund
          cp .env.example .env
          php artisan key:generate

      # The harness drives chrome-headless-shell (puppeteer's `headless: 'shell'`), which puppeteer can fetch itself.
      - name: Install chrome-headless-shell
        id: chrome
        run: |
          out=$(npx puppeteer browsers install chrome-headless-shell@stable | tail -1)
          echo "path=${out#* }" >> "$GITHUB_OUTPUT"

      # axe-core is not a project dependency; flows22 (the accessibility pass) skips itself without it.
      - name: Install axe-core
        run: npm i --no-save --no-audit --no-fund axe-core

      - name: Build frontend
        run: npm run build

      - name: Run the tournament flows
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: scripts/ui-audit/tournaments/run.sh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tournament-flow-screenshots
          path: /tmp/ui-audit-tournaments/shots

      - name: Report a failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly browser flows are failing"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The nightly browser flows failed on $(date -u +%F): $RUN_URL (the screenshots are attached to the run)."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
